name: NewsPulse AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Verification
        run: npm run lint

      - name: Run Vitest Unit & Integration Test Suite
        run: npx vitest run

      - name: Compile Next.js Production Build
        run: npm run build
